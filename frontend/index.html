<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>Goddel Motors — Quality Vehicles for Sale</title>
    <meta
      name="description"
      content="Browse quality vehicles for sale at Goddel Motors. View photos, prices and specifications, then contact us by WhatsApp, phone or enquiry form."
    />
    <meta property="og:site_name" content="Goddel Motors" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Goddel Motors — Quality Vehicles for Sale" />
    <meta
      property="og:description"
      content="Browse quality vehicles for sale at Goddel Motors."
    />
    <meta property="og:image" content="/images/goddel-hero-1600.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('gm-theme');
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Goddel Motors requires JavaScript to browse the inventory.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
